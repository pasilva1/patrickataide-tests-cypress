name: Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000' # Adjust if needed; for external site use browser
          # For external URL, Cypress can run without start if baseUrl is set
        env:
          CYPRESS_BASE_URL: https://www.patrickataide.com.br
